:root{
  --paper:#ffffff;--wash:#f4f5f2;--rule:#e6e7e3;--rule2:#d5d7d2;
  --ink:#1c1f22;--graphite:#62676d;--faint:#8b9096;
  --green:#5b2fc4;--green-tint:#efe8ff;--red:#d92d3a;--amber:#d98a00;--good:#16935a;
  --c-fixed:#9a96ad;--c-rec:#5b2fc4;--c-one:#e0952b;--bg:#f3f2f8;--deep:#3f1f8c;
  --st:max(env(safe-area-inset-top),var(--safe-area-inset-top,0px));--sb:max(env(safe-area-inset-bottom),var(--safe-area-inset-bottom,0px));
  --ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:400 15px/1.45 'Plex',Roboto,system-ui,sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button,label,.chip,.tab,.key{-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
input,select,textarea{background:var(--paper);border:1px solid var(--rule2);border-radius:10px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
.lbl{display:block;font-size:13px;color:var(--graphite);margin:16px 0 6px;font-weight:500}
.muted{color:var(--graphite)}.faint{color:var(--faint)}.small{font-size:13px}
.num{font-feature-settings:'tnum';white-space:nowrap}
.neg{color:var(--red)}.pos{color:var(--good)}
.btn{border:1px solid var(--rule2);background:var(--paper);border-radius:12px;padding:12px 16px;font-weight:500;cursor:pointer;width:100%;transition:background .15s}
.btn:active{background:var(--wash)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:active{background:#4a24a6}
.btn.danger{color:var(--red)}
.btn.sm{width:auto;padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px;margin-top:20px}
.link{background:none;border:0;color:var(--green);font-weight:500;cursor:pointer;padding:8px 0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}

#app{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 14px) max(20px,calc(50% - 300px)) calc(110px + var(--sb))}

/* header */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.title{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.title small{display:block;font-size:13px;font-weight:400;color:var(--graphite);letter-spacing:0;margin-top:4px}
.hbtns{display:flex;gap:4px}
.ibtn{width:40px;height:40px;border-radius:12px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ibtn:active{background:var(--wash)}
.ibtn svg{width:22px;height:22px}

/* statement head */
.spent{font-size:13px;color:var(--graphite)}
.spent-v{font-size:40px;font-weight:500;letter-spacing:-.02em;line-height:1.1;margin:2px 0 14px}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.meter .k{font-size:12.5px;color:var(--graphite)}
.meter .v{font-size:16px;font-weight:500;margin-top:1px}
.meter .of{font-size:12px;color:var(--faint)}
.track{height:3px;background:var(--rule);border-radius:2px;margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--green)}
.track i.warn{background:var(--amber)}.track i.over{background:var(--red)}
.netline{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rule);font-size:14px}
.notes{margin:16px 0 4px;padding-left:12px;border-left:2px solid var(--green)}
.notes p{margin:0 0 6px;font-size:14px;color:#3a3f44}
.notes p:last-child{margin:0}

/* passbook log */
.log{margin-top:6px}
.log .dgroup:first-child{border-top:0}
.dgroup{display:grid;grid-template-columns:52px 1fr;border-top:1px solid var(--rule);padding:12px 0 4px}
.dcol{padding-top:2px}
.dcol .dn{font-size:22px;font-weight:500;line-height:1}
.dcol .dw{font-size:12px;color:var(--graphite);margin-top:3px}
.dcol .dt{font-size:11.5px;color:var(--faint);margin-top:6px}
.ent{position:relative;overflow:hidden}
.ent .bg{position:absolute;inset:0;opacity:0;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:16px;font-weight:500;font-size:14px}
.ent .fg{position:relative;background:var(--paper);display:flex;align-items:flex-start;gap:12px;padding:6px 0 10px;cursor:pointer;touch-action:pan-y;transition:transform .2s var(--ease)}
.ent .fg.drag{transition:none}
.ent.swiping .bg{opacity:1}
.ent .d{flex:1;min-width:0}
.ent .d .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .c{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--graphite);margin-top:1px}
.ent .tag{font-size:11.5px;color:var(--amber)}
.ent .a{font-weight:500;padding-top:1px}
.empty{padding:48px 8px;text-align:center;color:var(--graphite)}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px;font-size:16px}

/* extended FAB */
.fab{position:fixed;right:max(20px,calc(50% - 300px));bottom:calc(78px + var(--sb));height:52px;padding:0 20px 0 16px;border-radius:16px;border:0;background:var(--green);color:#fff;font-weight:500;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 8px 24px rgba(23,97,74,.28);z-index:11}
.fab svg{width:22px;height:22px}
.fab:active{background:#4a24a6}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:var(--sb);z-index:10}
.tabs .in{display:flex;width:100%;max-width:640px}
.tab{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;font-weight:500;color:var(--faint);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--green)}

/* report */
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;margin:4px 0 8px}
.donut{position:relative;width:150px;height:150px}
.donut svg{transform:rotate(-90deg)}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .ctr b{font-size:18px;font-weight:600}
.donut .ctr span{font-size:12px;color:var(--graphite)}
.leg{display:flex;flex-direction:column;gap:7px}
.leg div{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:13.5px}
.leg div span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{font-size:17px;font-weight:600;margin:28px 0 10px;letter-spacing:-.01em}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:8px 0 10px}
.split i{display:block;height:100%}
.rows .r{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.rows .r:last-child{border-bottom:0}
.rows .r.tot{font-weight:600}
.key-l{display:flex;align-items:center;gap:8px}
details.full{margin-top:28px;border-top:1px solid var(--rule)}
details.full summary{list-style:none;cursor:pointer;padding:16px 0;font-weight:600;display:flex;justify-content:space-between}
details.full summary::-webkit-details-marker{display:none}
details.full summary::after{content:'Show';font-weight:500;color:var(--green);font-size:14px}
details.full[open] summary::after{content:'Hide'}
table{border-collapse:collapse;width:100%;margin:6px 0 18px;font-size:13.5px;font-feature-settings:'tnum'}
th,td{border-bottom:1px solid var(--rule);padding:7px 6px;text-align:right}
th{font-weight:500;color:var(--graphite);font-size:12.5px;border-bottom-color:var(--rule2)}
td:first-child,th:first-child{text-align:left;padding-left:0}
td:last-child,th:last-child{padding-right:0}
tr.tot td{font-weight:600;border-bottom:0}
h4{font-size:14px;font-weight:600;margin:18px 0 2px}

/* trend */
.chart{display:flex;align-items:flex-end;gap:12px;height:190px;padding-top:18px;border-bottom:1px solid var(--rule2);position:relative}
.chart .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--rule)}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:pointer}
.bar i{display:block;width:100%}
.bar i:first-of-type{border-radius:5px 5px 0 0}
.bar .bv{position:absolute;left:0;right:0;text-align:center;font-size:11.5px;color:var(--graphite);transform:translateY(-18px)}
.xl{display:flex;gap:12px;margin-top:6px}
.xl span{flex:1;text-align:center;font-size:12px;color:var(--graphite)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--graphite);margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}

/* settings */
.group{margin-bottom:22px}
.group h3{font-size:13px;font-weight:500;color:var(--graphite);margin:0 0 6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.item:first-of-type{border-top:1px solid var(--rule)}
.item .s{font-size:13px;color:var(--graphite);margin-top:1px}
.item .chev{color:var(--faint);font-size:18px}
.switch{position:relative;width:46px;height:28px;border-radius:99px;background:var(--rule2);border:0;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.switch.on{background:var(--green)}.switch.on::after{transform:translateX(18px)}

/* sheet */
#overlay{position:fixed;inset:0;z-index:20;visibility:hidden}
#overlay.open{visibility:visible}
#scrim{position:absolute;inset:0;background:rgba(20,24,22,.32);opacity:0;transition:opacity .22s}
#overlay.open #scrim{opacity:1}
#sheet{overscroll-behavior:contain;position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:calc(100dvh - var(--st) - 8px);overflow-y:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:8px 20px calc(20px + var(--sb));transform:translateY(100%);transition:transform .28s var(--ease)}
#sheet.tall{height:calc(100dvh - var(--st) - 8px)}
#overlay.open #sheet{transform:none}
#overlay.closing #sheet{transform:translateY(100%)}#overlay.closing #scrim{opacity:0}
.grab{width:36px;height:4px;border-radius:9px;background:var(--rule2);margin:2px auto 10px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;min-height:40px}
.sh h2{margin:0;font-size:18px;font-weight:600}
.sh .ibtn{margin-right:-8px}
.sh .left{margin-left:-8px;margin-right:0}

/* add screen */
.amount{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:8px 0 4px;margin:0}
.amount .cur{font-size:36px;color:var(--faint)}
.amount input{border:0;padding:0;width:auto;max-width:260px;font-size:46px;font-weight:500;letter-spacing:-.02em;text-align:left;font-feature-settings:'tnum';background:none}
.amount input::placeholder{color:var(--rule2)}
.desc{border:0;border-bottom:1px solid var(--rule2);border-radius:0;padding:10px 2px;font-size:16px;text-align:center}
.desc:focus{border-bottom-color:var(--green)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule2);background:var(--paper);border-radius:99px;padding:6px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--green);background:var(--green-tint);color:#0f4433;font-weight:500}
.chip.sug{background:var(--wash);border-color:var(--wash)}
.chip.sug .num{color:var(--graphite)}
.more-t{display:flex;justify-content:space-between;align-items:center;padding:12px 0 2px;color:var(--graphite);font-size:14px;cursor:pointer;border:0;background:none;width:100%}
.more-t b{color:var(--green);font-weight:500}
.seg{display:flex;border:1px solid var(--rule2);border-radius:10px;overflow:hidden}

<script>
'use strict';
const CATS={
  rent:['PG rent','Housing','fixed'],physio_bill:['Physio bill','Health','fixed'],
  swiggy:['Food - Swiggy','Food','recurring'],zomato:['Food - Zomato','Food','recurring'],lunch:['Food - Office lunch','Food','recurring'],
  eatout:['Food - Eating out','Food','recurring'],snacks:['Food - Fruits & snacks','Food','recurring'],grocery:['Groceries & quick-commerce','Groceries','recurring'],
  t_office:['Transport - Office','Transport','recurring'],t_physio:['Transport - Physio','Transport','recurring'],t_local:['Transport - Local outings','Transport','recurring'],
  electricity:['Housing - Electricity','Housing','recurring'],laundry:['Housing - Laundry','Housing','recurring'],recharge:['Recharges','Bills','recurring'],
  sub_rec:['Subscriptions - recurring','Subscriptions','recurring'],salon:['Salon','Personal','recurring'],physio_consult:['Physio consultation','Health','recurring'],
  travel:['Travel & trips','Travel','oneoff'],gifts:['Gifts, social & family','Social','oneoff'],entertainment:['Entertainment','Fun','oneoff'],
  sub_one:['Subscriptions - one-off','Subscriptions','oneoff'],personal:['Personal purchases & fees','Shopping','oneoff'],health:['Health - clinic, medicines, tests','Health','oneoff'],
  other:['Other','Other','recurring']
};
const RULES=[
  [/\bpg rent\b|^rent\b|house rent/,'rent'],
  [/physio bill/,'physio_bill'],
  [/physio consult|phsio consult/,'physio_consult'],
  [/new sim/,'personal'],
  [/recharg/,'recharge'],
  [/flight|airport|railway|bus stand|\btrain\b|seat selection|clock ?room/,'travel'],
  [/electricity/,'electricity'],
  [/laundry/,'laundry'],
  [/youtube|netflix|prime video|hotstar|spotify|jiocinema/,'sub_rec'],
  [/subscription|bumble/,'sub_one'],
  [/saloon|salon|haircut/,'salon'],
  [/gift|donation|party|sweets|for sister|for mom|for grandma|for dad|amazon for/,'gifts'],
  [/courier|charges|repair|\bmisc\b/,'personal'],
  [/fruit|snack|banana|cool drink|protein bar|juice/,'snacks'],
  [/instamart|zepto|blinkit|bigbasket|dmart|grocer/,'grocery'],
  [/swiggy/,'swiggy'],
  [/zomato/,'zomato'],
  [/lunch/,'lunch'],
  [/ to /,'_ride'],
  [/restaurant|restro|food with|food outside|food at|dinner|mcdonald|kfc|bistro|cafe|eating out|pizza|domino|burger/,'eatout'],
  [/movie|entertainment|theat|concert/,'entertainment'],
  [/bought|case\b|protector|mask|membrane|cord|dress|shoe|pant|shirt|boxer|bottle|power bank|charger|earphone/,'personal'],
  [/medicine|clinic|pharma|\btest\b|doctor|hospital/,'health'],
];
function categorize(desc){
  const d=' '+String(desc||'').toLowerCase().replace(/\s+/g,' ').trim()+' ';
  for(const [re,cat] of RULES){
    if(re.test(d)){
      if(cat!=='_ride')return cat;
      if(/physio|phsio/.test(d))return 't_physio';
      if(/\bofc\b|office/.test(d))return 't_office';

function parseAmount(s){const v=parseFloat(String(s||'').replace(/[₹,\s]|rs\.?/gi,''));return isFinite(v)?v:NaN}
function parseDate(s){
  const m=String(s||'').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(!m)return null;let y=+m[3];if(y<100)y+=2000;

/* Parses rows copied from Excel: "date<TAB>description<TAB>amount", blank date = same day as above */
function parsePaste(text){
  const out=[],skipped=[];let lastDate=null,lastCat=null;
  for(const raw of String(text).split(/\r?\n/)){
    if(!raw.trim())continue;
    let cols=raw.split('\t');
    if(cols.length<2)cols=raw.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
    cols=cols.map(c=>c.trim().replace(/^"|"$/g,''));

    if(cols.length<2){if(!/^[a-z]+[_ -]?\d{4}$/i.test(raw.trim()))skipped.push(raw);continue}
    const amt=parseAmount(cols[cols.length-1]);
    if(!isFinite(amt)||amt<=0){skipped.push(raw);continue}
    const dt=parseDate(cols[0]);
    if(dt)lastDate=dt;
    if(!lastDate){skipped.push(raw);continue}
    const desc=(dt?cols.slice(1,-1):cols.slice(0,-1)).filter(Boolean).join(' ').trim();
    const cat=desc?categorize(desc):(lastCat||'other');
    lastCat=cat;
    out.push({date:lastDate,desc:desc||'(unlabelled)',amount:Math.round(amt*100)/100,cat});
  }
  return {rows:out,skipped};

/* ============ Nightly reminder (Android) ============ */
const REM_BASE=9100;
async function scheduleReminder(){
  if(!NATIVE)return;
  try{
    const pend=await nat('LocalNotifications','getPending');
    const mine=(pend.notifications||[]).filter(n=>n.id>=REM_BASE&&n.id<REM_BASE+40);
    if(mine.length)await nat('LocalNotifications','cancel',{notifications:mine.map(n=>({id:n.id}))});
    if(!S.remind.on)return;
    await nat('LocalNotifications','createChannel',{id:'daily',name:'Daily reminder',description:'Reminder to log the day\'s expenses',importance:3,visibility:1}).catch(()=>{});
    const loggedToday=D.entries.some(e=>e.date===today()),list=[],now=Date.now();
    for(let i=0;i<30;i++){
      const at=new Date();at.setDate(at.getDate()+i);at.setHours(S.remind.hour,S.remind.minute,0,0);
      if(at.getTime()<=now+60000||(i===0&&loggedToday))continue;
      list.push({id:REM_BASE+i,title:'Anything to log today?',body:'Add today\'s expenses to Ledger while you remember them.',channelId:'daily',schedule:{at:at.toISOString(),allowWhileIdle:true},smallIcon:'ic_stat_ledger',iconColor:'#17614A'});
    }
    if(list.length)await nat('LocalNotifications','schedule',{notifications:list});
  }catch(e){console.warn('reminder',e)}
}

let atRoot=false,rootT=null;
function guard(){if(atRoot){clearTimeout(rootT);atRoot=false;history.pushState({home:1},'')}}
function goTab(t){
  if(t===view.tab)return;
  guard();
  const dir=TAB_ORDER.indexOf(t)>TAB_ORDER.indexOf(view.tab)?'r':'l';
  if(view.tab==='log')history.pushState({tab:t},'');
  else if(t==='log'){history.back();return}   // popstate brings us home
  else history.replaceState({tab:t},'');
  view.tab=t;app.scrollTop=0;tick('tick');render(dir);
}
function onRootBack(){
  if(view.tab!=='log'){view.tab='log';app.scrollTop=0;render('l');return}
  atRoot=true;toast('Press back again to exit');
  clearTimeout(rootT);rootT=setTimeout(()=>{if(atRoot&&!stack.length){atRoot=false;history.pushState({home:1},'')}},2000);
}

      r.sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
      const tot=r.reduce((s,e)=>s+e.amount,0);
      $('#res').innerHTML=(t||st.cats.size)?(r.length?`<div class="rows"><div class="r tot"><span>${r.length} expense${r.length>1?'s':''}</span><span class="num">${inr(tot,1)}</span></div></div>`+r.slice(0,200).map(e=>`<div class="r2" data-id="${esc(e.id)}"><div class="d"><div class="t">${esc(e.desc)}</div><div class="c"><span class="dot" style="background:${cat(e.cat).color};margin-right:6px"></span>${esc(catName(e.cat))}, ${toDate(e.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</div></div><div class="num" style="font-weight:500">${inr(e.amount,1)}</div></div>`).join(''):'<div class="empty">No matching expenses.</div>'):'<p class="muted small">Type to search, or pick categories to filter.</p>';
    };
    q.oninput=()=>{st.q=q.value;run()};
    sheetEl.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{st.scope=b.dataset.s;sheetEl.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b));run()});
    $('#fc').onclick=ev=>{const b=ev.target.closest('[data-f]');if(!b)return;const id=b.dataset.f;st.cats.has(id)?st.cats.delete(id):st.cats.add(id);b.classList.toggle('on');run()};
    $('#res').onclick=ev=>{const r=ev.target.closest('[data-id]');if(r)pushSheet(entryView(r.dataset.id))};
    $('#cls').onclick=popSheet;run();
  }};
}

/* ============ Report ============ */
function donut(items,total){
  const R=60,C=2*Math.PI*R;let off=0;
  const arcs=items.map(([,v,col])=>{const len=v/total*C;const s=`<circle cx="75" cy="75" r="${R}" fill="none" stroke="${col}" stroke-width="18" stroke-dasharray="${Math.max(0,len-1.5)} ${C}" stroke-dashoffset="${-off}"/>`;off+=len;return s}).join('');
  return `<div class="donut"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="${R}" fill="none" stroke="${'#eef0ec'}" stroke-width="18"/>${arcs}</svg><div class="ctr"><b class="num">${inr(total)}</b><span>spent</span></div></div>`;
}

      ${oneoffs.length?`<table><tr><th>Item</th><th>Date</th><th>Amount</th></tr>${oneoffs.map(e=>`<tr><td>${esc(e.desc)}</td><td>${toDate(e.date).getDate()} ${esc(mShort(k))}</td><td>${inr(e.amount)}</td></tr>`).join('')}<tr class="tot"><td>Total</td><td></td><td>${inr(st.b.oneoff)}</td></tr></table>`:'<p class="muted">No one-offs this month.</p>'}

/* all expenses of one type in a month */

/* ============ Trend ============ */
function recBy(st){const o={};st.es.forEach(e=>{if(bucketOf(e)==='recurring'){const c=resolve(e.cat);o[c]=(o[c]||0)+e.amount}});return o}
function renderTrend(){
  const ms=monthsWithData();
  if(!ms.length){$('#body').innerHTML='<div class="empty"><b>No history yet</b>Add or import expenses to see month-by-month trends.</div>';return}
  const last=ms.slice(-6),S6=last.map(stats);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const cur=thisMonth(),past=last.filter(m=>m!==cur),PS=past.map(stats),PR=PS.map(recBy);
  const mlink=m=>`<button class="link" data-m="${m}" style="padding:0">${esc(mLong(m))}</button>`;
  const row=(label,f,cls='')=>`<tr class="${cls}"><td>${label}</td>${S6.map(s=>`<td>${f(s)}</td>`).join('')}</tr>`;
  // 1. this month against your average
  let vsHTML='';
  const avgRec=avg(PS.map(s=>s.b.recurring));
  if(ms.includes(cur)&&PS.length){
    const sc=stats(cur),d=new Date().getDate(),N=daysInMonth(cur);
    if(d>=5){const p=sc.b.recurring/d*N,diff=p-avgRec;
      vsHTML=`<div class="big-line num ${diff>0?'neg':'pos'}">${diff>0?'▲':'▼'} ${inr(Math.abs(diff))}</div><p class="muted" style="margin:2px 0 0">${esc(mLong(cur))} is heading for <b class="num">${inr(p)}</b> in recurring spending, ${diff>0?'above':'below'} your average of <span class="num">${inr(avgRec)}</span> over the last ${PS.length} month${PS.length>1?'s':''}.</p>`}
    else vsHTML=`<p class="muted" style="margin:0">It's early in ${esc(mLong(cur))}. From the 5th, this shows how the month compares with your average of <span class="num">${inr(avgRec)}</span>.</p>`;
  }else if(PS.length>=2){
    const lm=past[past.length-1],ls=PS[PS.length-1],o=avg(PS.slice(0,-1).map(s=>s.b.recurring)),diff=ls.b.recurring-o;
    vsHTML=`<div class="big-line num ${diff>0?'neg':'pos'}">${diff>0?'▲':'▼'} ${inr(Math.abs(diff))}</div><p class="muted" style="margin:2px 0 0">${esc(mLong(lm))} recurring was <b class="num">${inr(ls.b.recurring)}</b>, ${diff>0?'above':'below'} your earlier average of <span class="num">${inr(o)}</span>.</p>`;
  }else vsHTML='<p class="muted" style="margin:0">Needs at least two months of history.</p>';
  // 2. best and worst months, and what drove the worst one
  let bwHTML='<p class="muted" style="margin:0">Needs at least two months of history.</p>';
  if(PS.length>=2){
    const idx=PS.map((s,i)=>i).sort((x,y)=>PS[x].b.recurring-PS[y].b.recurring),lo=idx[0],hi=idx[idx.length-1];
    const others=PR.filter((_,i)=>i!==hi);let drv=null,drvUp=0;
    Object.keys(PR[hi]).forEach(c=>{const up=PR[hi][c]-avg(others.map(o=>o[c]||0));if(up>drvUp){drvUp=up;drv=c}});
    bwHTML=`<div class="rows">
      <div class="r"><span>Lowest: ${mlink(past[lo])}</span><span class="num pos">${inr(PS[lo].b.recurring)}</span></div>
      <div class="r"><span>Highest: ${mlink(past[hi])}</span><span class="num neg">${inr(PS[hi].b.recurring)}</span></div></div>
      ${drv?`<p class="muted small" style="margin:8px 0 0">${esc(mLong(past[hi]))} was mostly pushed up by <b>${esc(catName(drv))}</b>, <span class="num">${inr(drvUp)}</span> more than its usual month.</p>`:''}`;
  }
  // 3. categories that keep rising or falling
  let chHTML='<p class="muted" style="margin:0">Needs at least three months of history.</p>';
  if(PR.length>=3){
    const L=PR.slice(-3),names=past.slice(-3).map(mShort);
    const cats=[...new Set(L.flatMap(o=>Object.keys(o)))];
    const up=[],down=[];
    cats.forEach(c=>{const v=L.map(o=>o[c]||0);
      if(v[0]<v[1]&&v[1]<v[2]&&v[2]-v[0]>=300)up.push([c,v]);
      if(v[0]>v[1]&&v[1]>v[2]&&v[0]-v[2]>=300)down.push([c,v]);});
    up.sort((x,y)=>(y[1][2]-y[1][0])-(x[1][2]-x[1][0]));down.sort((x,y)=>(x[1][2]-x[1][0])-(y[1][2]-y[1][0]));
    const li=([c,v],cls)=>`<div class="r"><span>${esc(catName(c))}</span><span class="num small">${v.map(x=>inr(x)).join(' → ')} <b class="${cls}">${cls==='neg'?'▲':'▼'}</b></span></div>`;
    chHTML=`<p class="muted small" style="margin:0 0 6px">Your last three months: ${names.join(', ')}</p>
      ${up.length?`<h4 style="margin:6px 0 0">Rising every month</h4><div class="rows">${up.slice(0,4).map(x=>li(x,'neg')).join('')}</div>`:''}
      ${down.length?`<h4 style="margin:10px 0 0">Falling every month</h4><div class="rows">${down.slice(0,4).map(x=>li(x,'pos')).join('')}</div>`:''}
      ${!up.length&&!down.length?'<p class="muted" style="margin:0">No category has gone steadily up or down over these three months.</p>':''}`;
  }
  $('#body').innerHTML=`
    <div class="card"><div class="sec">This month against your average</div>${vsHTML}</div>
    <div class="card"><div class="sec">Best and worst months</div>${bwHTML}</div>
    <div class="card"><div class="sec">Changes to watch</div>${chHTML}</div>
    <div class="card"><div class="sec">Your averages</div>
    <div class="rows">
      <div class="r"><span>Recurring per month</span><span class="num">${inr(avg(S6.map(s=>s.b.recurring)))}</span></div>
      <div class="r"><span>One-offs per month</span><span class="num">${inr(avg(S6.map(s=>s.b.oneoff)))}</span></div>
      <div class="r"><span>Food delivery per month</span><span class="num">${inr(avg(S6.map(s=>s.deliv.sum)))}, ${avg(S6.map(s=>s.deliv.n)).toFixed(0)} orders</span></div>
    </div></div>
    <div class="card"><div class="sec">Month by month</div>
    <div style="overflow-x:auto;margin:0 -16px;padding:0 16px"><table style="min-width:${150+last.length*82}px">
      <tr><th></th>${last.map(m=>`<th><button class="link" data-m="${m}" style="padding:0;font-weight:600">${esc(mShort(m))}</button></th>`).join('')}</tr>
      ${row('Total spent',s=>inr(s.total))}${row('Fixed',s=>inr(s.b.fixed))}${row('Recurring',s=>inr(s.b.recurring))}${row('One-offs',s=>inr(s.b.oneoff))}
      ${row('Food, all',s=>inr(s.food))}${row('Swiggy and Zomato',s=>inr(s.deliv.sum))}${row('Office transport',s=>inr(s.officeT))}${row('Physio transport',s=>inr(s.physioT))}
      ${row('Groceries',s=>inr(s.grocery))}${row('Electricity and laundry',s=>inr(s.elecLaundry))}${row('Recharges',s=>inr(s.recharge))}
      ${row('Saved',s=>inr(s.saved))}${row('Left after savings',s=>`<span class="${s.net<0?'neg':''}">${inr(s.net)}</span>`,'tot')}
    </table></div></div>
    <p class="muted small">Tap a month name to open its report.</p>`;
  $('#body').querySelectorAll('[data-m]').forEach(c=>c.onclick=()=>{view.month=c.dataset.m;goTab('report')});
}

/* ============ Excel export (.xlsx, offline) ============ */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  for(const [name,content] of files){
    const data=enc.encode(content),nm=enc.encode(name),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer),nm,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+data.length;
  }
  const cs=central.reduce((s,a)=>s+a.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xesc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sheetXML(rows,widths){
  const col=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
  const cell=(v,r,c,style)=>{const ref=col(c)+(r+1);
    if(v&&typeof v==='object'&&v.date){const d=toDate(v.date);return `<c r="${ref}" s="2"><v>${Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/864e5)}</v></c>`}
    if(typeof v==='number')return `<c r="${ref}" s="${style||3}"><v>${v}</v></c>`;
    return `<c r="${ref}" t="inlineStr"${style?` s="${style}"`:''}><is><t>${xesc(v??'')}</t></is></c>`};
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>cell(v,ri,ci,ri===0?1:null)).join('')}</row>`).join('')}</sheetData></worksheet>`;
}
function buildXlsx(){
  const es=[...D.entries].sort((a,b)=>a.date.localeCompare(b.date)||(a.created||0)-(b.created||0));
  const s1=[['Date','Description','Category','Amount (₹)','Type (if set)'],...es.map(e=>[{date:e.date},e.desc,catName(e.cat),e.amount,e.bucket?BUCKETS[e.bucket]:''])];
  const ms=monthsWithData(),st=ms.map(stats);
  const s2=[['Month','Total spent','Fixed','Recurring','One-offs','Food delivery','Delivery orders','Salary','Saved / invested','Left after savings and bills'],...ms.map((m,i)=>[mFull(m),r2(st[i].total),r2(st[i].b.fixed),r2(st[i].b.recurring),r2(st[i].b.oneoff),r2(st[i].deliv.sum),st[i].deliv.n,+st[i].inc.salary||0,st[i].saved,r2(st[i].net)])];
  const ids=Object.keys(D.cats).filter(c=>D.entries.some(e=>resolve(e.cat)===c));
  const s3=[['Category',...ms.map(mFull)],...ids.map(c=>[D.cats[c].name,...st.map(s=>r2(s.by[c]||0))])];
  return workbook(['Expenses','Monthly summary','By category'],[s1,s2,s3],[[12,34,26,13,13],[18,13,11,12,11,13,15,11,15,17],[30,...ms.map(()=>15)]]);

/* one month, laid out like your monthly reports */
function buildMonthXlsx(k){
  const st=stats(k),T=st.total;
  const es=[...st.es].sort((a,b)=>a.date.localeCompare(b.date)||(a.created||0)-(b.created||0));
  const sum=[['Item','Amount (₹)'],['Salary',+st.inc.salary||0],...(st.inc.saves||[]).map(x=>[x.name,+x.amount||0]),['Total saved / invested',st.saved],['Total spent',r2(T)],...st.pendingList.map(x=>[`${x.name} (bill, not paid yet)`,+x.amount||0]),[st.bills.length?'Left after savings and bills':'Left after savings',r2(st.net)],['',''],
    ['Fixed',r2(st.b.fixed)],['Recurring',r2(st.b.recurring)],['One-offs',r2(st.b.oneoff)],['',''],['Food delivery orders',st.deliv.n],['Food delivery total',r2(st.deliv.sum)],['Average order',st.deliv.n?r2(st.deliv.sum/st.deliv.n):0]];
  const exp=[['Date','Description','Category','Amount (₹)','Type (if set)'],...es.map(e=>[{date:e.date},e.desc,catName(e.cat),e.amount,e.bucket?BUCKETS[e.bucket]:''])];
  const cats=Object.entries(st.by).sort((a,b)=>b[1]-a[1]);
  const cat=[['Category','Entries','Amount (₹)','Share %'],...cats.map(([c,v])=>[catName(c),st.cnt[c],r2(v),Math.round(v/T*1000)/10]),['Total',st.es.length,r2(T),100]];
  const one=es.filter(e=>bucketOf(e)==='oneoff').sort((a,b)=>b.amount-a.amount);
  const ones=[['Item','Date','Amount (₹)'],...one.map(e=>[e.desc,{date:e.date},e.amount]),['Total','',r2(st.b.oneoff)]];
  const wk=[['Week','Recurring (₹)','Of which delivery (₹)'],...st.weeks.map(w=>[`${w.a}–${w.z} ${mShort(k)}`,r2(w.rec),r2(w.del)]),['Total',r2(st.b.recurring),r2(st.deliv.sum)]];
  return workbook(['Summary','Expenses','Categories','One-offs','Week by week'],[sum,exp,cat,ones,wk],[[26,16],[12,34,26,13,13],[30,10,14,10],[34,12,14],[18,16,22]]);
}

  bind:()=>{
    $('#cls').onclick=popSheet;
    const month=k=>{if(!inMonth(k).length){toast(`No expenses in ${mFull(k)}`);return}shareBlob(buildMonthXlsx(k),`ledger-${mLong(k).toLowerCase()}-${k.slice(0,4)}.xlsx`)};
    $('#xThis').onclick=()=>month(thisMonth());
    $('#xAll').onclick=()=>{if(D.entries.length)shareBlob(buildXlsx(),`ledger-all-${today()}.xlsx`)};
    $('#xGo').onclick=()=>month($('#xM').value);
  }};
}

/* ============ Settings ============ */
function renderSettings(){
  const n=D.entries.length,saveTot=(D.plan.saves||[]).reduce((s,x)=>s+(+x.amount||0),0);
  const item=(id,t,s,right='<span class="chev">›</span>')=>`<div class="item" id="${id}"><div><div>${t}</div>${s?`<div class="s">${s}</div>`:''}</div>${right}</div>`;
  $('#body').innerHTML=`
    <div class="group"><h3>Money</h3>
      ${item('sPlan','Monthly plan',`Salary ${inr(+D.plan.salary||0)}, saving ${inr(saveTot)}${(D.plan.bills||[]).length?`, bills ${inr(D.plan.bills.reduce((s,x)=>s+(+x.amount||0),0))}`:''} a month`)}
      ${item('sBud','Budgets',[D.budgets.recurring&&`Recurring ${inr(D.budgets.recurring)}`,D.budgets.delivery&&`delivery ${inr(D.budgets.delivery)}`,D.budgets.oneoff&&`one-offs ${inr(D.budgets.oneoff)}`].filter(Boolean).join(', ')||'Not set')}
      ${item('sCat','Categories',`${Object.keys(D.cats).length} categories`)}
    </div>
    <div class="group"><h3>Reminders</h3>
      ${item('sRem','Daily reminder',S.remind.on?`On at ${fmtTime()}`:'Off')}
    </div>
    <div class="group"><h3>Your data</h3>
      ${item('sImp','Import from Excel','Paste rows copied from your sheet')}
      ${item('sXls','Export to Excel',n?'One month or all months':'Nothing to export yet')}
      ${item('sBak','Save a backup','A file you can keep in Google Drive')}
      ${item('sRes','Restore a backup','Replaces everything in Ledger')}
    </div>
    ${NATIVE?`<div class="group"><h3>Feel</h3>${item('sHap','Vibration','A light tick when you save or delete',`<button class="switch ${S.haptic?'on':''}" aria-label="Vibration"></button>`)}</div>`:''}
    ${NATIVE?`<div class="group"><h3>Privacy</h3>${item('sLock','Fingerprint lock','Ask for your fingerprint when Ledger opens',`<button class="switch ${S.lock?'on':''}" aria-label="Fingerprint lock"></button>`)}</div>`:''}
    <div class="group"><h3>Danger zone</h3>${item('sWipe','<span class="neg">Erase all data</span>','Removes every expense, category change, budget and plan')}</div>
    <p class="muted small">Ledger stores everything on this phone and never connects to the internet. Auto-categories follow the rules from your monthly reports, plus any words you add to a category.</p>`;
  const on=(id,f)=>{const el=$('#'+id);if(el)el.onclick=f};
  on('sPlan',()=>pushSheet(incomeView(null)));on('sBud',()=>pushSheet(budgetView()));on('sCat',()=>pushSheet(categoriesView()));on('sRem',()=>pushSheet(reminderView()));
  on('sImp',()=>pushSheet(importView()));
  on('sXls',()=>{if(n)pushSheet(exportView())});
  on('sBak',()=>shareBlob(new Blob([JSON.stringify({app:'ledger',v:2,saved:Date.now(),data:D})],{type:'application/json'}),`ledger-backup-${today()}.json`));
  on('sRes',async()=>{const j=await pickJSON();if(!j)return;if(j.app!=='ledger'||!j.data){toast('That file is not a Ledger backup');return}
    if(!await dialog({title:'Restore this backup?',message:`It contains ${j.data.entries.length} expenses. Everything in Ledger now will be replaced.`,ok:'Restore',danger:true}))return;
    D=j.data;migrate();save();view.month=monthsWithData().slice(-1)[0]||thisMonth();render();toast('Backup restored')});
  on('sHap',()=>{S.haptic=!S.haptic;saveS();renderSettings();if(S.haptic)tick('confirm')});
  on('sLock',async()=>{
    if(S.lock){S.lock=false;saveS();renderSettings();toast('Fingerprint lock off');return}
    try{const r=await nat('NativeBiometric','isAvailable',{useFallback:true});if(!r.isAvailable){toast('Set up a fingerprint or screen lock first');return}
      busy=true;await nat('NativeBiometric','verifyIdentity',{title:'Confirm it\'s you',negativeButtonText:'Cancel',useFallback:true});S.lock=true;saveS();renderSettings();toast('Fingerprint lock on')}catch(e){}finally{busy=false}});
  on('sWipe',async()=>{const t=await dialog({title:'Erase all data?',message:'Type DELETE to remove everything from Ledger on this phone.',input:'text',placeholder:'DELETE',ok:'Erase',danger:true});
    if(t!=='DELETE'){if(t!==null)toast('Nothing was erased');return}D=DEFAULT_DATA();save();render();scheduleReminder();toast('All data erased')});
}

render();
scheduleReminder();
</script>
</body>
</html>
