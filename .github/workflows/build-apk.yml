name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Check signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Copy app files
        run: |
          mkdir -p www
          cp index.html icon.svg www/

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon and splash screen
        continue-on-error: true
        run: |
          node make-icons.mjs
          npx capacitor-assets generate --android --iconBackgroundColor '#17614a' --iconBackgroundColorDark '#17614a' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'

      - name: Notification icon, steady screen, version
        run: |
          cat > android/app/src/main/java/com/vinay/ledger/MainActivity.java <<'EOF'
          package com.vinay.ledger;

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // No stretch/bounce when pulling past the top or bottom, so the tab bar never moves
                  getBridge().getWebView().setOverScrollMode(View.OVER_SCROLL_NEVER);
              }
          }
          EOF
          cat > android/app/src/main/res/drawable/ic_stat_ledger.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:fillType="evenOdd"
                  android:pathData="M6,3h12a1,1 0,0 1,1 1v17l-2.3,-1.4 -2.3,1.4 -2.4,-1.4 -2.4,1.4 -2.3,-1.4L5,21V4a1,1 0,0 1,1 -1zM8,7v2h8V7H8zM8,11v2h8v-2H8zM8,15v2h5v-2H8z"/>
          </vector>
          EOF
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > release.p12
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.p12 --ks-type PKCS12 --ks-pass pass:cardvault-sign --ks-key-alias cardvault --out Ledger.apk aligned.apk
          "$BT/apksigner" verify Ledger.apk
          rm release.p12

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Ledger 1.${{ github.run_number }}
          body: Download **Ledger.apk** below and open it on your phone to install or update.
          files: Ledger.apk
          make_latest: true
